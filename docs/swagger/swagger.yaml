basePath: /
definitions:
  app.ErrorResponse:
    properties:
      code:
        example: 20002
        type: integer
      details:
        items:
          type: string
        type: array
      msg:
        example: 用户名或密码错误
        type: string
    type: object
  handler.ContentItemResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      parent_id:
        type: integer
      size:
        type: integer
      type:
        type: string
      updated_at:
        type: string
    type: object
  handler.CreateFolderRequest:
    properties:
      name:
        example: 旅行照片
        type: string
      parent_id:
        example: 1
        type: integer
    required:
    - name
    - parent_id
    type: object
  handler.CreateFolderResponse:
    properties:
      created_at:
        example: "2026-09-15T10:30:00+08:00"
        type: string
      id:
        example: 2
        type: integer
      name:
        example: 旅行照片
        type: string
      parent_id:
        example: 1
        type: integer
    type: object
  handler.FileListItemResponse:
    properties:
      created_at:
        type: string
      folder_id:
        type: integer
      id:
        type: integer
      name:
        type: string
      sha256:
        type: string
      size:
        type: integer
    type: object
  handler.FolderContentsResponse:
    properties:
      folder:
        $ref: '#/definitions/handler.FolderListItemResponse'
      items:
        items:
          $ref: '#/definitions/handler.ContentItemResponse'
        type: array
      order:
        type: string
      page:
        type: integer
      page_size:
        type: integer
      sort:
        type: string
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  handler.FolderListItemResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      parent_id:
        type: integer
    type: object
  handler.ListFilesResponse:
    properties:
      files:
        items:
          $ref: '#/definitions/handler.FileListItemResponse'
        type: array
      folder_id:
        type: integer
    type: object
  handler.ListFolderChildrenResponse:
    properties:
      children:
        items:
          $ref: '#/definitions/handler.FolderListItemResponse'
        type: array
      folder:
        $ref: '#/definitions/handler.FolderListItemResponse'
    type: object
  handler.ListFoldersResponse:
    properties:
      children:
        items:
          $ref: '#/definitions/handler.FolderListItemResponse'
        type: array
      root:
        $ref: '#/definitions/handler.FolderListItemResponse'
    type: object
  handler.LoginRequest:
    properties:
      password:
        example: password123
        type: string
      username:
        example: alice
        type: string
    required:
    - password
    - username
    type: object
  handler.LoginResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  handler.MoveFileRequest:
    properties:
      folder_id:
        example: 20
        type: integer
    required:
    - folder_id
    type: object
  handler.MoveFileResponse:
    properties:
      folder_id:
        example: 20
        type: integer
      id:
        example: 1
        type: integer
    type: object
  handler.MoveFolderRequest:
    properties:
      parent_id:
        example: 10
        type: integer
    required:
    - parent_id
    type: object
  handler.MoveFolderResponse:
    properties:
      id:
        example: 7
        type: integer
      parent_id:
        example: 10
        type: integer
    type: object
  handler.ProfileResponse:
    properties:
      create_time:
        example: "2026-09-13T10:00:00+08:00"
        type: string
      id:
        example: 42
        type: integer
      quota_limit:
        example: 10737418240
        type: integer
      used_quota:
        example: 1048576
        type: integer
      username:
        example: alice
        type: string
    type: object
  handler.QuotaResponse:
    properties:
      limit:
        example: 10737418240
        type: integer
      remaining:
        example: 10736369664
        type: integer
      used:
        example: 1048576
        type: integer
    type: object
  handler.RegisterRequest:
    properties:
      password:
        example: password123
        type: string
      username:
        example: alice
        type: string
    required:
    - password
    - username
    type: object
  handler.RegisterResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  handler.RenameFileRequest:
    properties:
      name:
        example: 新的文件名.pdf
        type: string
    required:
    - name
    type: object
  handler.RenameFileResponse:
    properties:
      id:
        example: 1
        type: integer
      name:
        example: 新的文件名.pdf
        type: string
    type: object
  handler.RenameFolderRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  handler.RenameFolderResponse:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  handler.SearchResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handler.ContentItemResponse'
        type: array
      order:
        type: string
      page:
        type: integer
      page_size:
        type: integer
      query:
        type: string
      sort:
        type: string
      total:
        type: integer
      total_pages:
        type: integer
      type:
        type: string
    type: object
  handler.UploadFileResponse:
    properties:
      created_at:
        example: "2026-09-17T10:30:00+08:00"
        type: string
      folder_id:
        example: 10
        type: integer
      id:
        example: 1
        type: integer
      name:
        example: photo.jpg
        type: string
      sha256:
        example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        type: string
      size:
        example: 1048576
        type: integer
    type: object
info:
  contact: {}
  description: Disk 后端服务接口文档，提供用户认证和文件存储能力。
  title: Disk 存储服务 API
  version: "1.0"
paths:
  /api/files:
    post:
      consumes:
      - multipart/form-data
      description: 上传文件并计算 SHA-256；相同内容复用物理文件，同一目录下不能存在同名文件。
      parameters:
      - description: 目标目录 ID
        in: formData
        name: folder_id
        required: true
        type: integer
      - description: 待上传文件
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 上传成功
          schema:
            $ref: '#/definitions/handler.UploadFileResponse'
        "400":
          description: 请求参数或文件名不合法
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "401":
          description: 未提供有效的身份凭证
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "404":
          description: 目标目录不存在或无权访问
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "409":
          description: 目标目录下已存在同名文件
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "413":
          description: 文件超过上传大小限制
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "500":
          description: 上传文件失败
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "507":
          description: 存储额度不足
          schema:
            $ref: '#/definitions/app.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 上传文件
      tags:
      - 文件
  /api/files/{id}:
    delete:
      description: 删除逻辑文件并扣减用户额度；物理文件没有其他引用时同时清理底层存储对象。
      parameters:
      - description: 文件 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: 删除成功
        "400":
          description: 文件 ID 不合法
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "401":
          description: 未提供有效的身份凭证
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "404":
          description: 文件不存在或无权访问
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "500":
          description: 删除文件失败
          schema:
            $ref: '#/definitions/app.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除文件
      tags:
      - 文件
    patch:
      consumes:
      - application/json
      description: 重命名当前用户拥有的逻辑文件，同一目录下不能存在同名文件。
      parameters:
      - description: 文件 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 新的文件名
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RenameFileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 重命名成功
          schema:
            $ref: '#/definitions/handler.RenameFileResponse'
        "400":
          description: 请求参数或文件名不合法
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "401":
          description: 未提供有效的身份凭证
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "404":
          description: 文件不存在或无权访问
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "409":
          description: 同一目录下已存在同名文件
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "500":
          description: 重命名文件失败
          schema:
            $ref: '#/definitions/app.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 重命名文件
      tags:
      - 文件
  /api/files/{id}/download:
    get:
      description: 根据逻辑文件 ID 下载当前用户拥有的文件，客户端不能指定底层存储 Key。
      parameters:
      - description: 文件 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: 文件内容
          schema:
            type: file
        "400":
          description: 文件 ID 不合法
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "401":
          description: 未提供有效的身份凭证
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "404":
          description: 文件不存在或无权访问
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "500":
          description: 下载文件失败
          schema:
            $ref: '#/definitions/app.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 下载文件
      tags:
      - 文件
  /api/files/{id}/move:
    patch:
      consumes:
      - application/json
      description: 将当前用户拥有的逻辑文件移动到新的目录，目标目录下不能存在同名文件。
      parameters:
      - description: 文件 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 目标目录
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.MoveFileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 移动成功
          schema:
            $ref: '#/definitions/handler.MoveFileResponse'
        "400":
          description: 请求参数不合法
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "401":
          description: 未提供有效的身份凭证
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "404":
          description: 文件或目标目录不存在或无权访问
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "409":
          description: 目标目录下已存在同名文件
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "500":
          description: 移动文件失败
          schema:
            $ref: '#/definitions/app.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 移动文件
      tags:
      - 文件
  /api/folders:
    post:
      consumes:
      - application/json
      description: 在当前登录用户拥有的父文件夹下创建子目录。文件夹名称不能为空，不能是“/”、“.”或“..”，也不能包含“/”或“\”；同一父目录下不能存在同名文件夹。
      parameters:
      - description: 子目录信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateFolderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/handler.CreateFolderResponse'
        "400":
          description: 请求参数或文件夹名称不合法
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "401":
          description: 未提供有效的身份凭证
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "404":
          description: 父文件夹不存在
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "409":
          description: 同一父目录下已存在同名文件夹
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "500":
          description: 创建文件夹失败
          schema:
            $ref: '#/definitions/app.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建子目录
      tags:
      - 文件夹
  /api/folders/{id}:
    delete:
      description: 删除当前用户拥有的非根目录。目录中存在子目录或文件时不能删除。
      parameters:
      - description: 文件夹 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: 删除成功
        "400":
          description: 文件夹 ID 不合法
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "401":
          description: 未提供有效的身份凭证
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "404":
          description: 文件夹不存在或无权访问
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "409":
          description: 根目录不能删除或文件夹不为空
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "500":
          description: 删除文件夹失败
          schema:
            $ref: '#/definitions/app.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除空目录
      tags:
      - 文件夹
    patch:
      consumes:
      - application/json
      description: 重命名当前用户拥有的非根目录。文件夹名称遵循创建目录时的相同规则，同一父目录下不能存在同名文件夹。
      parameters:
      - description: 文件夹 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 新的文件夹名称
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RenameFolderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 重命名成功
          schema:
            $ref: '#/definitions/handler.RenameFolderResponse'
        "400":
          description: 请求参数或文件夹名称不合法
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "401":
          description: 未提供有效的身份凭证
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "404":
          description: 文件夹不存在、无权访问或为根目录
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "409":
          description: 同一父目录下已存在同名文件夹
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "500":
          description: 重命名文件夹失败
          schema:
            $ref: '#/definitions/app.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 重命名文件夹
      tags:
      - 文件夹
  /api/folders/{id}/children:
    get:
      description: 返回当前用户拥有的指定目录及其直接子目录，不递归加载更深层级。
      parameters:
      - description: 文件夹 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            $ref: '#/definitions/handler.ListFolderChildrenResponse'
        "400":
          description: 文件夹 ID 不合法
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "401":
          description: 未提供有效的身份凭证
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "404":
          description: 文件夹不存在或无权访问
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "500":
          description: 获取目录列表失败
          schema:
            $ref: '#/definitions/app.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取指定目录的子目录
      tags:
      - 文件夹
  /api/folders/{id}/contents:
    get:
      description: 合并返回直接子目录和文件，文件夹始终位于文件之前，支持分页及白名单排序。
      parameters:
      - description: 目录 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认 50，最大 100
        in: query
        name: page_size
        type: integer
      - description: 排序字段：name、size、created_at、updated_at
        in: query
        name: sort
        type: string
      - description: 排序方向：asc、desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            $ref: '#/definitions/handler.FolderContentsResponse'
        "400":
          description: 查询参数不合法
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "401":
          description: 未提供有效的身份凭证
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "404":
          description: 目录不存在或无权访问
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "500":
          description: 获取目录内容失败
          schema:
            $ref: '#/definitions/app.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取目录内容
      tags:
      - 文件夹
  /api/folders/{id}/files:
    get:
      description: 返回当前用户指定目录中的直接文件，不包含子目录中的文件，也不暴露底层存储 Key。
      parameters:
      - description: 目录 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            $ref: '#/definitions/handler.ListFilesResponse'
        "400":
          description: 目录 ID 不合法
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "401":
          description: 未提供有效的身份凭证
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "404":
          description: 目录不存在或无权访问
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "500":
          description: 获取文件列表失败
          schema:
            $ref: '#/definitions/app.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取目录中的文件
      tags:
      - 文件
  /api/folders/{id}/move:
    patch:
      consumes:
      - application/json
      description: 将当前用户拥有的非根目录移动到新的父目录。不能移动到自身或自己的后代，目标目录下不能存在同名文件夹。
      parameters:
      - description: 待移动文件夹 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 目标父目录
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.MoveFolderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 移动成功
          schema:
            $ref: '#/definitions/handler.MoveFolderResponse'
        "400":
          description: 请求参数不合法
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "401":
          description: 未提供有效的身份凭证
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "404":
          description: 源目录或目标目录不存在或无权访问
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "409":
          description: 根目录不能移动、移动会形成目录环或目标目录存在同名文件夹
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "500":
          description: 移动文件夹失败
          schema:
            $ref: '#/definitions/app.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 移动文件夹
      tags:
      - 文件夹
  /api/folders/root/children:
    get:
      description: 返回当前登录用户的根目录信息及其直接子目录，不递归加载更深层级。
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            $ref: '#/definitions/handler.ListFoldersResponse'
        "401":
          description: 未提供有效的身份凭证
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "404":
          description: 根目录不存在
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "500":
          description: 获取目录列表失败
          schema:
            $ref: '#/definitions/app.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取根目录的子目录
      tags:
      - 文件夹
  /api/profile:
    get:
      description: 根据已通过 JWT 鉴权的用户 ID 获取当前用户的基本信息和已用存储配额
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/handler.ProfileResponse'
        "401":
          description: 身份信息不存在或无效
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "500":
          description: 服务内部错误
          schema:
            $ref: '#/definitions/app.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取用户基本信息
      tags:
      - 认证
  /api/quota:
    get:
      description: 返回当前用户的已用、总量和剩余额度。
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            $ref: '#/definitions/handler.QuotaResponse'
        "401":
          description: 未提供有效的身份凭证
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "500":
          description: 服务内部错误
          schema:
            $ref: '#/definitions/app.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取存储额度
      tags:
      - 用户
  /api/search:
    get:
      description: 按名称搜索当前用户的文件和非根目录，支持类型筛选、分页和排序。
      parameters:
      - description: 搜索关键字
        in: query
        name: q
        required: true
        type: string
      - description: 类型：all、folder、file，默认 all
        in: query
        name: type
        type: string
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认 50，最大 100
        in: query
        name: page_size
        type: integer
      - description: 排序字段：name、size、created_at、updated_at
        in: query
        name: sort
        type: string
      - description: 排序方向：asc、desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 搜索成功
          schema:
            $ref: '#/definitions/handler.SearchResponse'
        "400":
          description: 搜索参数不合法
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "401":
          description: 未提供有效的身份凭证
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "500":
          description: 搜索失败
          schema:
            $ref: '#/definitions/app.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 搜索文件和目录
      tags:
      - 搜索
  /login:
    post:
      consumes:
      - application/json
      description: 使用用户名和密码完成身份认证，成功后返回访问令牌。用户名不存在和密码错误统一返回“用户名或密码错误”。
      parameters:
      - description: 登录信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            $ref: '#/definitions/handler.LoginResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "401":
          description: 用户名或密码错误
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "500":
          description: 服务内部错误
          schema:
            $ref: '#/definitions/app.ErrorResponse'
      summary: 用户登录
      tags:
      - 认证
  /register:
    post:
      consumes:
      - application/json
      description: 使用用户名和密码创建用户,同时为用户创建文件根目录,成功后返回访问令牌。
      parameters:
      - description: 注册信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 注册成功
          schema:
            $ref: '#/definitions/handler.RegisterResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "409":
          description: 用户名已存在
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "500":
          description: 服务内部错误
          schema:
            $ref: '#/definitions/app.ErrorResponse'
      summary: 用户注册
      tags:
      - 认证
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 请输入 Bearer、一个空格和访问令牌，例如：Bearer eyJhbGciOiJIUzI1NiIs...
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
