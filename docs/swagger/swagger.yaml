basePath: /
definitions:
  app.ErrorResponse:
    properties:
      code:
        example: 20002
        type: integer
      details:
        items:
          type: string
        type: array
      msg:
        example: 用户名或密码错误
        type: string
    type: object
  handler.CreateFolderRequest:
    properties:
      name:
        example: 旅行照片
        type: string
      parent_id:
        example: 1
        type: integer
    required:
    - name
    - parent_id
    type: object
  handler.CreateFolderResponse:
    properties:
      created_at:
        example: "2026-09-15T10:30:00+08:00"
        type: string
      id:
        example: 2
        type: integer
      name:
        example: 旅行照片
        type: string
      parent_id:
        example: 1
        type: integer
    type: object
  handler.FolderListItemResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      parent_id:
        type: integer
    type: object
  handler.ListFolderChildrenResponse:
    properties:
      children:
        items:
          $ref: '#/definitions/handler.FolderListItemResponse'
        type: array
      folder:
        $ref: '#/definitions/handler.FolderListItemResponse'
    type: object
  handler.ListFoldersResponse:
    properties:
      children:
        items:
          $ref: '#/definitions/handler.FolderListItemResponse'
        type: array
      root:
        $ref: '#/definitions/handler.FolderListItemResponse'
    type: object
  handler.LoginRequest:
    properties:
      password:
        example: password123
        type: string
      username:
        example: alice
        type: string
    required:
    - password
    - username
    type: object
  handler.LoginResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  handler.ProfileResponse:
    properties:
      create_time:
        example: "2026-09-13T10:00:00+08:00"
        type: string
      id:
        example: 42
        type: integer
      used_quota:
        example: 1048576
        type: integer
      username:
        example: alice
        type: string
    type: object
  handler.RegisterRequest:
    properties:
      password:
        example: password123
        type: string
      username:
        example: alice
        type: string
    required:
    - password
    - username
    type: object
  handler.RegisterResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  handler.RenameFolderRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  handler.RenameFolderResponse:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
info:
  contact: {}
  description: Disk 后端服务接口文档，提供用户认证和文件存储能力。
  title: Disk 存储服务 API
  version: "1.0"
paths:
  /api/folders:
    post:
      consumes:
      - application/json
      description: 在当前登录用户拥有的父文件夹下创建子目录。文件夹名称不能为空，不能是“/”、“.”或“..”，也不能包含“/”或“\”；同一父目录下不能存在同名文件夹。
      parameters:
      - description: 子目录信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CreateFolderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/handler.CreateFolderResponse'
        "400":
          description: 请求参数或文件夹名称不合法
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "401":
          description: 未提供有效的身份凭证
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "404":
          description: 父文件夹不存在
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "409":
          description: 同一父目录下已存在同名文件夹
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "500":
          description: 创建文件夹失败
          schema:
            $ref: '#/definitions/app.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建子目录
      tags:
      - 文件夹
  /api/folders/{id}:
    patch:
      consumes:
      - application/json
      description: 重命名当前用户拥有的非根目录。文件夹名称遵循创建目录时的相同规则，同一父目录下不能存在同名文件夹。
      parameters:
      - description: 文件夹 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 新的文件夹名称
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RenameFolderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 重命名成功
          schema:
            $ref: '#/definitions/handler.RenameFolderResponse'
        "400":
          description: 请求参数或文件夹名称不合法
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "401":
          description: 未提供有效的身份凭证
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "404":
          description: 文件夹不存在、无权访问或为根目录
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "409":
          description: 同一父目录下已存在同名文件夹
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "500":
          description: 重命名文件夹失败
          schema:
            $ref: '#/definitions/app.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 重命名文件夹
      tags:
      - 文件夹
  /api/folders/{id}/children:
    get:
      description: 返回当前用户拥有的指定目录及其直接子目录，不递归加载更深层级。
      parameters:
      - description: 文件夹 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            $ref: '#/definitions/handler.ListFolderChildrenResponse'
        "400":
          description: 文件夹 ID 不合法
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "401":
          description: 未提供有效的身份凭证
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "404":
          description: 文件夹不存在或无权访问
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "500":
          description: 获取目录列表失败
          schema:
            $ref: '#/definitions/app.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取指定目录的子目录
      tags:
      - 文件夹
  /api/folders/root/children:
    get:
      description: 返回当前登录用户的根目录信息及其直接子目录，不递归加载更深层级。
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            $ref: '#/definitions/handler.ListFoldersResponse'
        "401":
          description: 未提供有效的身份凭证
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "404":
          description: 根目录不存在
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "500":
          description: 获取目录列表失败
          schema:
            $ref: '#/definitions/app.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取根目录的子目录
      tags:
      - 文件夹
  /api/profile:
    get:
      description: 根据已通过 JWT 鉴权的用户 ID 获取当前用户的基本信息和已用存储配额
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/handler.ProfileResponse'
        "401":
          description: 身份信息不存在或无效
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "500":
          description: 服务内部错误
          schema:
            $ref: '#/definitions/app.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取用户基本信息
      tags:
      - 认证
  /login:
    post:
      consumes:
      - application/json
      description: 使用用户名和密码完成身份认证，成功后返回访问令牌。用户名不存在和密码错误统一返回“用户名或密码错误”。
      parameters:
      - description: 登录信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            $ref: '#/definitions/handler.LoginResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "401":
          description: 用户名或密码错误
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "500":
          description: 服务内部错误
          schema:
            $ref: '#/definitions/app.ErrorResponse'
      summary: 用户登录
      tags:
      - 认证
  /register:
    post:
      consumes:
      - application/json
      description: 使用用户名和密码创建用户,同时为用户创建文件根目录,成功后返回访问令牌。
      parameters:
      - description: 注册信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 注册成功
          schema:
            $ref: '#/definitions/handler.RegisterResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "409":
          description: 用户名已存在
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "500":
          description: 服务内部错误
          schema:
            $ref: '#/definitions/app.ErrorResponse'
      summary: 用户注册
      tags:
      - 认证
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 请输入 Bearer、一个空格和访问令牌，例如：Bearer eyJhbGciOiJIUzI1NiIs...
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
