basePath: /
definitions:
  app.ErrorResponse:
    properties:
      code:
        example: 20002
        type: integer
      details:
        items:
          type: string
        type: array
      msg:
        example: 用户名或密码错误
        type: string
    type: object
  handler.LoginRequest:
    properties:
      password:
        example: password123
        type: string
      username:
        example: alice
        type: string
    required:
    - password
    - username
    type: object
  handler.LoginResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  handler.RegisterRequest:
    properties:
      password:
        example: password123
        type: string
      username:
        example: alice
        type: string
    required:
    - password
    - username
    type: object
  handler.RegisterResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
info:
  contact: {}
  description: Disk 后端服务接口文档，提供用户认证和文件存储能力。
  title: Disk 存储服务 API
  version: "1.0"
paths:
  /login:
    post:
      consumes:
      - application/json
      description: 使用用户名和密码完成身份认证，成功后返回访问令牌。用户名不存在和密码错误统一返回“用户名或密码错误”。
      parameters:
      - description: 登录信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            $ref: '#/definitions/handler.LoginResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "401":
          description: 用户名或密码错误
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "500":
          description: 服务内部错误
          schema:
            $ref: '#/definitions/app.ErrorResponse'
      summary: 用户登录
      tags:
      - 认证
  /register:
    post:
      consumes:
      - application/json
      description: 使用用户名和密码创建用户，成功后返回访问令牌。
      parameters:
      - description: 注册信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 注册成功
          schema:
            $ref: '#/definitions/handler.RegisterResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "409":
          description: 用户名已存在
          schema:
            $ref: '#/definitions/app.ErrorResponse'
        "500":
          description: 服务内部错误
          schema:
            $ref: '#/definitions/app.ErrorResponse'
      summary: 用户注册
      tags:
      - 认证
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 请输入 Bearer 加一个空格再加访问令牌，例如：Bearer eyJhbGciOiJIUzI1NiIs...
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
