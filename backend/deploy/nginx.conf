events {}

http {
    upstream disk_backend {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    # 1 GiB 文件加 1 MiB multipart 边界/字段开销，与应用配置保持一致。
    client_max_body_size 1025m;
    client_body_buffer_size 128k;
    client_body_temp_path /var/cache/nginx/client_temp 1 2;

    server {
        listen 80;
        return 308 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_tokens off;

        # 由证书管理器或部署 Secret 挂载，禁止把私钥提交到仓库。
        ssl_certificate /run/secrets/tls_certificate;
        ssl_certificate_key /run/secrets/tls_private_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location / {
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_pass http://disk_backend;
        }
    }
}
